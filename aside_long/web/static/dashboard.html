<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>롱폼 공방</title>
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#22201c;--sub:#6b665c;--line:#e4ddd0;--acc:#c2410c;--acc2:#0f766e;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Malgun Gothic","Apple SD Gothic Neo",sans-serif}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:#22201c;color:#f6f3ec}
header h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.3px}
header h1 small{font-weight:400;color:#c9c1b2;font-size:13px;margin-left:8px}
header .sp{flex:1}
header select{background:#3a362f;color:#fff;border:1px solid #57514a;border-radius:6px;padding:5px 8px}
.wrap{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px 20px 230px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
h2{font-size:15px;margin:0 0 10px}
h3{font-size:14px;margin:14px 0 6px}
label{font-size:12px;color:var(--sub);display:block;margin:8px 0 3px}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;background:#fffdf8}
textarea{resize:vertical}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 11px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#b9ae9a}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button.go{background:var(--acc2);border-color:var(--acc2);color:#fff}
button:disabled{opacity:.45;cursor:default}
.drop{border:2px dashed #c9bfae;border-radius:10px;padding:18px 10px;text-align:center;color:var(--sub);cursor:pointer;margin-top:10px}
.drop.on{background:#fff4e6;border-color:var(--acc)}
.units{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.unit{border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;background:#fffdf8}
.unit.sel{border-color:var(--acc);box-shadow:0 0 0 2px #fde2cf}
.unit b{display:block;font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.pill{font-size:11px;padding:1px 7px;border-radius:99px;background:#efe9de;color:var(--sub)}
.pill.ok{background:#dcfce7;color:var(--ok)}.pill.warn{background:#fef3c7;color:var(--warn)}.pill.bad{background:#fee2e2;color:var(--bad)}
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.steps .arrow{color:#b9ae9a}
.tabs{display:flex;gap:4px;margin:14px 0 10px;border-bottom:1px solid var(--line)}
.tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 12px;font-weight:600;color:var(--sub)}
.tabs button.on{border-bottom-color:var(--acc);color:var(--ink)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.txt{white-space:pre-wrap;background:#fbf8f2;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:520px;overflow:auto;font-size:13px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
td,th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.score{font-size:30px;font-weight:800}
.chap{border-left:4px solid var(--acc);padding-left:10px;margin:18px 0 8px}
.scene{display:grid;grid-template-columns:200px 1fr;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:#fffdf8}
.scene img,.ph{width:200px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#eee7da;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px}
.line{display:grid;grid-template-columns:1fr 1fr 26px;gap:6px;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.gi{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fffdf8}
.gi img,.gi .ph{width:100%;aspect-ratio:16/9;object-fit:cover;display:flex}
.gi .meta{padding:6px 8px;font-size:12px}
.gi .meta div{color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gi .btns{display:flex;gap:4px;padding:0 8px 8px}
video{width:100%;border-radius:8px;background:#000}
.muted{color:var(--sub);font-size:12.5px}
#log{position:fixed;left:0;right:0;bottom:0;height:var(--logh,210px);background:#1d1b18;color:#e9e3d6;font:12.5px/1.5 Consolas,"Malgun Gothic",monospace;padding:8px 20px;overflow:auto}
#logbar{position:fixed;left:0;right:0;bottom:var(--logh,210px);height:10px;cursor:ns-resize;background:#3a362f;z-index:5;display:flex;align-items:center;justify-content:center;user-select:none}
#logbar::before{content:'';width:46px;height:3px;border-radius:2px;background:#8a8172}
#logbar:hover,#logbar.drag{background:#57514a}
body.resizing{cursor:ns-resize;user-select:none}
#log .busy{color:#fbbf24}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{padding:40px;text-align:center;color:var(--sub)}

nav.tabs-top{display:flex;gap:2px;margin-left:18px}
nav.tabs-top button{background:none;border:none;color:#c9c1b2;font-weight:700;font-size:15px;padding:8px 14px;border-radius:7px}
nav.tabs-top button.on{background:#f6f3ec;color:#22201c}
header .stop{background:#3a362f;color:#fff;border-color:#57514a}
.page{padding:16px 20px calc(var(--logh,210px) + 30px);max-width:1500px;margin:0 auto}
.grid2{display:grid;grid-template-columns:380px 1fr;gap:16px}
.stat{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.stat .card{flex:1;min-width:140px}.stat b{font-size:26px;display:block}
.tbl tr:hover td{background:#fbf6ec;cursor:pointer}
.skel{max-height:560px;overflow:auto}
.skel .su{border-bottom:1px solid var(--line);padding:7px 2px}
.skel .su ul{margin:3px 0 0 26px;padding:0;color:var(--sub);font-size:12.5px}
.unitbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.unitbar select{max-width:560px}
</style>
</head>
<body>
<header>
  <h1>롱폼 공방</h1>
  <nav class="tabs-top" id="nav"></nav>
  <div class="sp"></div>
  <span id="busy" class="muted" style="color:#fbbf24"></span>
  <button class="stop" onclick="stopRun()">■ 멈춤</button>
  <select id="jobSel" style="max-width:280px;width:auto"></select>
</header>
<div class="page" id="page"></div>
<div id="logbar" title="끌어서 높이 조절 · 두 번 누르면 접기/펴기"></div>
<div id="log"></div>

<script>
let S = {jobs: []}, JOB = null, SID = null, U = null, PAGE = 'make', TAB = 'src', since = 0, DIRTY = false, SEL = new Set(), ACCS = null;
const PAGES = [['make', '만들기'], ['dash', '대시보드'], ['edit', '수정'], ['up', '업로드'], ['set', '설정']];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(url, opt = {}) {
  const r = await fetch(url, {headers: {'Content-Type': 'application/json'}, ...opt});
  if (!r.ok) { const t = await r.text(); let m = t; try { m = JSON.parse(t).detail } catch (e) {} ; alert(m); throw new Error(m) }
  return r.json();
}
const job = () => S.jobs.find(j => j.name === JOB);
const units = () => job()?.units || [];
function pill(t, cls = '') { return `<span class="pill ${cls}">${t}</span>` }
const readURL = f => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f) });

async function refresh() {
  S = await api('/api/state');
  if (JOB && !job()) JOB = null;
  if (!JOB && S.jobs.length) JOB = S.jobs[0].name;
  $('#jobSel').innerHTML = S.jobs.map(j => `<option value="${esc(j.name)}" ${j.name === JOB ? 'selected' : ''}>${esc(j.title || j.name)} (${esc(j.name)})</option>`).join('') || '<option>작업 없음 — 「만들기」에서 원고를 넣으세요</option>';
  $('#busy').textContent = S.busy ? '● 작업 중: ' + (S.cmd || []).slice(0, 1).join(' ') : '';
  document.querySelectorAll('[data-run]').forEach(b => b.disabled = S.busy);
}
$('#jobSel').onchange = e => { JOB = e.target.value; SID = null; U = null; SEL.clear(); show(PAGE) };
function nav() { $('#nav').innerHTML = PAGES.map(([k, t]) => `<button class="${PAGE === k ? 'on' : ''}" onclick="show('${k}')">${t}</button>`).join('') }
async function show(p) {
  if (DIRTY && PAGE === 'edit' && p !== 'edit' && !confirm('저장하지 않은 대본 수정이 있어요. 나갈까요?')) return;
  if (p !== PAGE) DIRTY = false;
  PAGE = p; nav(); await refresh();
  await ({make: pageMake, dash: pageDash, edit: pageEdit, up: pageUp, set: pageSet})[p]();
}

// ── 실행 ──
async function runArgs(args) { await api('/api/run', {method: 'POST', body: JSON.stringify({args})}); refresh() }
async function runCmd(cmd, extra = []) {
  if (DIRTY && !confirm('저장하지 않은 대본 수정이 있어요. 그래도 실행할까요?')) return;
  await runArgs([cmd, '--job', JOB, '--only', SID, ...extra]);
}
async function stopRun() { await api('/api/stop', {method: 'POST'}); refresh() }
function step(cmd, label, title) { return `<button data-run onclick="runCmd('${cmd}')" title="${title}" ${S.busy ? 'disabled' : ''}>${label}</button>` }

// ══ 만들기 — 원고 넣기 · 원고 뼈대 · 일괄 실행 ══
let SKEL = null;
async function pageMake() {
  SKEL = JOB ? await api('/api/skeleton/' + encodeURIComponent(JOB)) : null;
  const n = SKEL?.units.length || 0;
  $('#page').innerHTML = `<div class="grid2">
    <div class="card">
      <h2>1 원고 넣기</h2>
      <label>작업 이름 (폴더 이름 — 비우면 파일 이름에서)</label><input id="mkName" placeholder="예: 한국사1">
      <label>시리즈 제목</label><input id="mkTitle" placeholder="예: 고등학교 한국사1">
      <div class="drop" id="drop">docx 를 끌어다 놓거나 클릭<br><span class="muted">책 한 권이면 「주제 NN」마다 단원(영상 한 편)으로 나눠요.<br>원문은 01_raw 에 보관만 하고, 영상은 안전 개작본으로 만들어요.</span></div>
      <input type="file" id="file" accept=".docx,.txt,.md" multiple hidden>
      <p class="muted">같은 작업 이름으로 다시 넣으면 그 작업에 더해져요. 다른 책은 다른 이름으로.</p>
    </div>
    <div class="card">
      <h2>2 원고 뼈대 ${SKEL ? `<span class="muted">· ${esc(SKEL.title)} · 단원 ${n}개 · ${SKEL.units.reduce((a, u) => a + u.chars, 0).toLocaleString()}자</span>` : ''}</h2>
      ${!n ? '<div class="empty">아직 원고가 없어요 — 왼쪽에 docx 를 넣으세요.</div>' : `
      <div class="row" style="margin-bottom:6px"><label style="margin:0"><input type="checkbox" style="width:auto" onchange="selAll(this.checked)"> 전체 선택</label><span class="muted" id="selN"></span></div>
      <div class="skel">${SKEL.units.map(u => { const st = units().find(x => x.prefix === u.prefix) || {}; return `
        <div class="su"><label style="display:inline;margin:0;color:var(--ink)"><input type="checkbox" style="width:auto" data-sel="${u.prefix}" ${SEL.has(u.prefix) ? 'checked' : ''} onchange="tog('${u.prefix}',this.checked)">
          <b>${esc(u.prefix)}</b> ${esc(u.section)}</label> <span class="muted">${u.chars.toLocaleString()}자</span>
          ${st.script ? pill('대본 ' + (st.score ?? ''), 'ok') : ''}${st.video ? pill('영상', 'ok') : ''}${st.posted ? pill('업로드', 'ok') : ''}
          <ul>${u.heads.map(h => '<li>' + esc(h) + '</li>').join('')}</ul></div>`}).join('')}</div>
      <h2 style="margin-top:14px">3 만들기 <span class="muted">— 선택한 단원 (선택 없으면 전체)</span></h2>
      <div class="row">
        <button data-run onclick="bulk('prep')" title="개작 → 대본·채점·유튜브 문구 → 목소리 (그림 크레딧 안 씀)">▶ 1→3 개작·대본·목소리</button>
        <button class="go" data-run onclick="bulk('make')" title="대본·목소리 확인 뒤: 그림(Codex) → 영상 → 썸네일 (목소리가 없으면 먼저 만들어요)">▶ 4→6 그림·영상</button>
        <button class="pri" data-run onclick="bulk('all')" title="개작부터 썸네일까지 한 번에">▶ 전체 1→6</button>
      </div>
      <p class="muted">단원마다 Claude 약 10분, 그림은 씬 수(40장 안팎)만큼 Codex 를 써요. 한 단원이 실패해도 다음 단원으로 넘어가요. 진행은 「대시보드」에서.</p>`}
    </div></div>`;
  wireDrop(); updSel();
}
function tog(p, on) { on ? SEL.add(p) : SEL.delete(p); updSel() }
function selAll(on) { SEL = new Set(on ? SKEL.units.map(u => u.prefix) : []); document.querySelectorAll('[data-sel]').forEach(c => c.checked = on); updSel() }
function updSel() { const e = $('#selN'); if (e) e.textContent = SEL.size ? `${SEL.size}개 선택` : '선택 없음 = 전체' }
async function bulk(cmd) {
  const list = [...SEL], n = list.length || units().length;
  const what = {prep: '1→3 개작·대본·목소리까지', make: '4→6 그림·영상·썸네일까지', all: '개작부터 썸네일까지'}[cmd];
  if (!confirm(`「${JOB}」 단원 ${n}개를 ${what} 만들까요?`)) return;
  await runArgs([cmd, '--job', JOB, ...(list.length ? ['--only', list.join(',')] : [])]);
}
function wireDrop() {
  const drop = $('#drop'); if (!drop) return;
  drop.onclick = () => $('#file').click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('on') };
  drop.ondragleave = () => drop.classList.remove('on');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('on'); uploadDocs([...e.dataTransfer.files]) };
  $('#file').onchange = e => uploadDocs([...e.target.files]);
}
async function uploadDocs(files) {
  if (!files.length) return;
  const stem = files[0].name.replace(/\.[^.]+$/, '');
  let name = $('#mkName').value.trim();
  if (!name) {
    name = stem.replace(/^고등학교\s*/, '').replace(/[\\/:*?"<>|\s]+/g, '');
    if (!confirm(`작업 이름을 「${name}」(으)로 만들까요?`)) return;
  }
  const title = $('#mkTitle').value.trim() || stem;
  for (const f of files) await api('/api/upload', {method: 'POST', body: JSON.stringify({job: name, title, filename: f.name, data: await readURL(f)})});
  JOB = name; SEL.clear(); show('make');
}

// ══ 대시보드 — 단원 전체 현황 ══
function pageDash() {
  const us = units();
  if (!us.length) { $('#page').innerHTML = '<div class="card empty">작업이 없어요 — 「만들기」에서 원고를 넣으세요.</div>'; return }
  const c = k => us.filter(k).length;
  const mins = us.reduce((a, u) => a + (u.audio_min || 0), 0);
  $('#page').innerHTML = `
    <div class="stat">
      <div class="card"><span class="muted">단원</span><b>${us.length}</b></div>
      <div class="card"><span class="muted">개작</span><b>${c(u => u.rewrite)}</b></div>
      <div class="card"><span class="muted">대본</span><b>${c(u => u.script)}</b></div>
      <div class="card"><span class="muted">그림 완료</span><b>${c(u => u.scenes && u.images >= u.scenes)}</b></div>
      <div class="card"><span class="muted">영상</span><b>${c(u => u.video)}</b><span class="muted">총 ${mins.toFixed(0)}분</span></div>
      <div class="card"><span class="muted">업로드</span><b>${c(u => u.posted || u.scheduled)}</b></div>
    </div>
    <div class="card"><table class="tbl">
      <tr><th>번호</th><th>단원</th><th>원고</th><th>개작</th><th>대본</th><th>음성</th><th>그림</th><th>영상</th><th>업로드</th></tr>
      ${us.map(u => `<tr onclick="SID='${u.prefix}';U=null;show('edit')">
        <td><b>${esc(u.prefix)}</b></td><td>${esc(u.section)}</td><td class="muted">${(u.chars || 0).toLocaleString()}자</td>
        <td>${u.rewrite ? pill(u.rewrite_passed === false ? '문제 남음' : '통과', u.rewrite_passed === false ? 'warn' : 'ok') : '—'}</td>
        <td>${u.script ? pill((u.score ?? '') + '점' + (u.edited ? '·수정' : ''), u.score >= 80 ? 'ok' : 'warn') : '—'}</td>
        <td>${u.audio_min ? u.audio_min + '분' : '—'}</td>
        <td>${u.scenes ? pill(u.images + '/' + u.scenes, u.images >= u.scenes ? 'ok' : 'warn') : '—'}</td>
        <td>${u.video ? pill('완성', 'ok') : '—'}</td>
        <td>${u.posted ? `<a href="${esc(u.posted)}" target="_blank" onclick="event.stopPropagation()">올림</a>` : u.scheduled ? pill('예약 ' + esc(u.scheduled), 'ok') : u.upload_error ? pill('실패', 'bad') : '—'}</td></tr>`).join('')}
    </table><p class="muted">줄을 누르면 「수정」으로 가요.</p></div>`;
}

// ══ 수정 — 단원 하나: 원고·개작 / 대본 / 그림 / 영상 ══
function unitPicker(fn) {
  const us = units();
  if (!SID || !us.find(u => u.prefix === SID)) SID = us[0]?.prefix;
  return `<div class="unitbar"><b>단원</b><select onchange="if(DIRTY&&!confirm('저장하지 않은 수정이 있어요. 넘어갈까요?')){this.value=SID;return}SID=this.value;U=null;DIRTY=false;${fn}()">${us.map(u => `<option value="${u.prefix}" ${u.prefix === SID ? 'selected' : ''}>${esc(u.prefix)} · ${esc(u.section)}</option>`).join('')}</select></div>`;
}
async function loadUnit() {
  if (!SID) return;
  U = await api(`/api/unit/${encodeURIComponent(JOB)}/${SID}`);
  if (PAGE === 'edit' && $('#main')) renderMain(); else if (PAGE === 'up' && $('#tab')) await tabUp();
}
async function pageEdit() {
  if (!units().length) { $('#page').innerHTML = '<div class="card empty">작업이 없어요 — 「만들기」에서 원고를 넣으세요.</div>'; return }
  $('#page').innerHTML = unitPicker('pageEdit') + '<div class="card" id="main"></div>';
  await loadUnit();
}
function renderMain() {
  if (!U) return;
  const st = U.status;
  $('#main').innerHTML = `
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">${esc(st.prefix)} · ${esc(st.section)}</h2>
      <button onclick="openFolder()">폴더 열기</button>
    </div>
    <div class="steps" style="margin-top:10px">
      ${step('s0-rewrite', '1 안전 개작', '원문을 저작권 안전한 새 글로 (Claude)')}<span class="arrow">→</span>
      ${step('s1-script', '2 대본·채점', '롱폼 대본 + 100점 채점 + 유튜브 문구 (Claude)')}<span class="arrow">→</span>
      ${step('s2-tts', '3 목소리', 'SuperTonic3')}<span class="arrow">→</span>
      ${step('s3-images', '4 그림', 'Codex 3개 동시')}<span class="arrow">→</span>
      ${step('s4-render', '5 영상', 'ffmpeg 1920×1080')}<span class="arrow">→</span>
      ${step('s5-thumb', '6 썸네일', '1280×720')}
      <span style="flex:1"></span>
      <button data-run onclick="runCmd('prep')" ${S.busy ? 'disabled' : ''} title="개작 → 대본·채점 → 목소리">▶ 1→3</button>
      <button class="go" data-run onclick="runCmd('make')" ${S.busy ? 'disabled' : ''} title="그림 → 영상 → 썸네일">▶ 4→6</button>
      <button class="pri" data-run onclick="runCmd('all')" ${S.busy ? 'disabled' : ''}>▶ 전체 1→6</button>
    </div>
    <div class="tabs">

function collect() {
  const s = JSON.parse(JSON.stringify(U.script));
  document.querySelectorAll('#tab [data-c]').forEach(e => s.characters[+e.dataset.c][e.dataset.k] = e.value);
  document.querySelectorAll('#tab [data-ch]').forEach(e => s.chapters[+e.dataset.ch].title = e.value);
  document.querySelectorAll('#tab [data-si]').forEach(e => {
    const scn = s.chapters[+e.dataset.ci].scenes[+e.dataset.si], k = e.dataset.k;
    if (k === 'prompt') scn.image.prompt = e.value;
    else if (k === 'chars') scn.image.chars = e.value.split(',').map(x => x.trim()).filter(Boolean);
    else scn.lines[+e.dataset.li][k] = e.value;
  });
  s.thumbnail = {line1: $('#th1').value, line2: $('#th2').value, keyword: $('#thk').value};
  s.youtube = {title: $('#ytt').value, description: $('#ytd').value};
  return s;
}

      <button data-run onclick="runCmd('yt-meta',['--force'])">문구 다시 쓰기 (Claude)</button>
      <button data-run onclick="post(true)">미리 채워 보기</button>
      <button class="pri" data-run onclick="post(false)" ${U.video ? '' : 'disabled'}>▶ 유튜브에 올리기</button>
    </div>
    <p class="muted">왼쪽에 뜨는 Chrome(로그인된 전용 프로필)에서 YouTube Studio 가 자동으로 채워져요: 영상 → 제목·설명 → 썸네일 → 태그 → AI 사용 표시 → 아동용 아님 → 공개/예약 → 고정 댓글(공개일 때). 「미리 채워 보기」는 게시 버튼만 누르지 않아요.</p>
    ${!m ? '<div class="empty">대본이 있어야 문구가 생겨요.</div>' : `
    ${!up.ready ? '<p style="color:var(--warn)">아직 유튜브 문구를 쓰지 않았어요 — 「문구 다시 쓰기」를 눌러 주세요(지금은 대본의 기본 제목·설명).</p>' : ''}
    ${up.check ? pill(up.check.passed ? '원고 겹침 검사 통과' : '원고 겹침 ' + up.check.problems.length + '건', up.check.passed ? 'ok' : 'warn') : ''}
    <h3>제목 ${copy('ytT', '')}</h3><textarea id="ytT" rows="1" readonly>${esc(m.title)}</textarea>
    <h3>설명 ${copy('ytD', '')}</h3><textarea id="ytD" rows="16" readonly>${esc(m.description)}</textarea>
    <h3>태그 ${copy('ytG', '')}</h3><textarea id="ytG" rows="2" readonly>${esc(m.tags.join(', '))}</textarea>
    <h3>고정 댓글 ${copy('ytC', '')}</h3><textarea id="ytC" rows="1" readonly>${esc(m.pinned_comment)}</textarea>
    ${U.thumb ? `<h3>썸네일</h3><img src="${U.thumb}" style="width:360px;border-radius:8px">` : ''}`}`;
}
async function runPlain(args) { await api('/api/run', {method: 'POST', body: JSON.stringify({args})}); refresh() }
async function post(dry) {
  const at = $('#upAt').value, vis = $('#upVis').value, acc = $('#upAcc').value;
  const what = dry ? '업로드 창을 채워만 볼까요? (게시는 안 눌러요)' : at ? `${at.replace('T', ' ')} 에 예약 공개로 올릴까요?` : `지금 「${vis === 'public' ? '공개' : vis === 'unlisted' ? '일부 공개' : '비공개'}」로 올릴까요?`;
  if (!confirm(`${acc} 채널 — ${what}`)) return;
  const args = ['--account', acc, '--visibility', vis];
  if (at) args.push('--at', at.replace('T', ' '));
  if (dry) args.push('--dry-run');
  await runCmd('post', args);
}

async function openFolder() { await api('/api/open', {method: 'POST', body: JSON.stringify({path: U.folder})}) }

// ── 로그 ──
let wasBusy = false;
async function pollLog() {
  try {
    const r = await api('/api/log?since=' + since);
    since = r.next;
    if (r.lines.length) {
      const el = $('#log'), atEnd = el.scrollTop + el.clientHeight >= el.scrollHeight - 20;
      el.insertAdjacentHTML('beforeend', r.lines.map(l => `<div>${esc(l)}</div>`).join(''));
      if (atEnd) el.scrollTop = el.scrollHeight;
    }
    if (r.busy !== wasBusy) {
      const done = wasBusy && !r.busy;
      wasBusy = r.busy;
      await refresh();
      if (done && !DIRTY && PAGE !== 'set') show(PAGE);
    }
  } catch (e) {}
  setTimeout(pollLog, 1000);
}
// ── 로그 창 높이: 위 막대를 끌어서 조절, 두 번 누르면 접기/펴기 (브라우저에 기억) ──
(function () {
  const root = document.documentElement, bar = $('#logbar'), MIN = 28, KEY = 'aside_long_logh';
  const set = h => { h = Math.max(MIN, Math.min(window.innerHeight - 120, Math.round(h))); root.style.setProperty('--logh', h + 'px'); return h };
  let saved = 210; try { saved = +localStorage.getItem(KEY) || 210 } catch (e) {}
  let cur = set(saved), last = cur > MIN ? cur : 210;
  const save = () => { try { localStorage.setItem(KEY, cur) } catch (e) {} };
  bar.addEventListener('pointerdown', e => {
    e.preventDefault(); bar.setPointerCapture(e.pointerId); bar.classList.add('drag'); document.body.classList.add('resizing');
    const move = ev => { cur = set(window.innerHeight - ev.clientY - 5) };
    const up = () => { bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up);
      bar.classList.remove('drag'); document.body.classList.remove('resizing'); if (cur > MIN) last = cur; save() };
    bar.addEventListener('pointermove', move); bar.addEventListener('pointerup', up);
  });
  bar.addEventListener('dblclick', () => { cur = set(cur > MIN ? MIN : last); save() });
  window.addEventListener('resize', () => { cur = set(cur) });
})();
show('make').then(pollLog);
</script>
