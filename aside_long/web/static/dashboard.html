<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>롱폼 공방</title>
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#22201c;--sub:#6b665c;--line:#e4ddd0;--acc:#c2410c;--acc2:#0f766e;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Malgun Gothic","Apple SD Gothic Neo",sans-serif}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:#22201c;color:#f6f3ec}
header h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.3px}
header h1 small{font-weight:400;color:#c9c1b2;font-size:13px;margin-left:8px}
header .sp{flex:1}
header select{background:#3a362f;color:#fff;border:1px solid #57514a;border-radius:6px;padding:5px 8px}
.wrap{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px 20px 230px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
h2{font-size:15px;margin:0 0 10px}
h3{font-size:14px;margin:14px 0 6px}
label{font-size:12px;color:var(--sub);display:block;margin:8px 0 3px}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;background:#fffdf8}
textarea{resize:vertical}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 11px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#b9ae9a}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button.go{background:var(--acc2);border-color:var(--acc2);color:#fff}
button:disabled{opacity:.45;cursor:default}
.drop{border:2px dashed #c9bfae;border-radius:10px;padding:18px 10px;text-align:center;color:var(--sub);cursor:pointer;margin-top:10px}
.drop.on{background:#fff4e6;border-color:var(--acc)}
.units{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.unit{border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;background:#fffdf8}
.unit.sel{border-color:var(--acc);box-shadow:0 0 0 2px #fde2cf}
.unit b{display:block;font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.pill{font-size:11px;padding:1px 7px;border-radius:99px;background:#efe9de;color:var(--sub)}
.pill.ok{background:#dcfce7;color:var(--ok)}.pill.warn{background:#fef3c7;color:var(--warn)}.pill.bad{background:#fee2e2;color:var(--bad)}
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.steps .arrow{color:#b9ae9a}
.tabs{display:flex;gap:4px;margin:14px 0 10px;border-bottom:1px solid var(--line)}
.tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 12px;font-weight:600;color:var(--sub)}
.tabs button.on{border-bottom-color:var(--acc);color:var(--ink)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.txt{white-space:pre-wrap;background:#fbf8f2;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:520px;overflow:auto;font-size:13px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
td,th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.score{font-size:30px;font-weight:800}
.chap{border-left:4px solid var(--acc);padding-left:10px;margin:18px 0 8px}
.scene{display:grid;grid-template-columns:200px 1fr;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:#fffdf8}
.scene img,.ph{width:200px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#eee7da;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px}
.line{display:grid;grid-template-columns:1fr 1fr 26px;gap:6px;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.gi{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fffdf8}
.gi img,.gi .ph{width:100%;aspect-ratio:16/9;object-fit:cover;display:flex}
.gi .meta{padding:6px 8px;font-size:12px}
.gi .meta div{color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gi .btns{display:flex;gap:4px;padding:0 8px 8px}
video{width:100%;border-radius:8px;background:#000}
.muted{color:var(--sub);font-size:12.5px}
#log{position:fixed;left:0;right:0;bottom:0;height:210px;background:#1d1b18;color:#e9e3d6;font:12.5px/1.5 Consolas,"Malgun Gothic",monospace;padding:8px 20px;overflow:auto;border-top:3px solid #3a362f}
#log .busy{color:#fbbf24}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{padding:40px;text-align:center;color:var(--sub)}
</style>
</head>
<body>
<header>
  <h1>롱폼 공방<small>docx → 16:9 내레이션 영상 · Claude 대본 · Codex 그림</small></h1>
  <div class="sp"></div>
  <span id="busy" class="muted" style="color:#fbbf24"></span>
  <select id="jobSel"></select>
</header>

<div class="wrap">
  <aside>
    <div class="card">
      <h2>원고 넣기</h2>
      <label>작업(시리즈) 이름</label>
      <input id="jobName" value="세계사">
      <label>시리즈 제목</label>
      <input id="jobTitle" placeholder="예: 롱폼 세계사">
      <div class="drop" id="drop">docx 를 끌어다 놓거나 클릭<br><span class="muted">원문은 01_raw 에 보관만 하고, 영상은 안전 개작본으로 만들어요</span></div>
      <input type="file" id="file" accept=".docx,.txt,.md" multiple hidden>
      <div class="units" id="units"></div>
      <div class="row" style="margin-top:10px">
        <button class="pri" data-run onclick="runAll('all')" title="이 작업의 모든 단원을 개작부터 썸네일까지 차례로 (한 단원이 실패해도 다음으로)">▶ 모든 단원 1→6</button>
        <button data-run onclick="runAll('s1-script')" title="모든 단원 개작·대본만 먼저 (그림 크레딧 아끼기)">개작·대본만</button>
      </div>
    </div>
    <div class="card" style="margin-top:12px" id="setCard">
      <h2>설정 <span class="muted" id="setJob"></span></h2>
      <label>화풍</label><select id="sStyle"></select>
      <label>목표 길이(분)</label><input id="sMin" type="number" min="3" max="40" step="1">
      <div class="row"><div style="flex:1"><label>목소리</label><select id="sVoice"></select></div>
        <div style="flex:1"><label>말 속도</label><input id="sSpeed" type="number" min="0.8" max="1.4" step="0.05"></div></div>
      <label>썸네일 그림(씬 번호)</label><input id="sThumb" type="number" min="1" step="1">
      <div style="margin-top:10px"><button onclick="saveSettings()">설정 저장</button></div>
    </div>
  </aside>

  <main class="card" id="main"><div class="empty">왼쪽에서 원고(docx)를 넣고 단원을 고르세요.</div></main>
</div>

<div id="log"></div>

<script>
let S = {jobs: []}, JOB = null, SID = null, U = null, TAB = 'src', since = 0, DIRTY = false;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(url, opt = {}) {
  const r = await fetch(url, {headers: {'Content-Type': 'application/json'}, ...opt});
  if (!r.ok) { const t = await r.text(); let m = t; try { m = JSON.parse(t).detail } catch (e) {} ; alert(m); throw new Error(m) }
  return r.json();
}
function job() { return S.jobs.find(j => j.name === JOB) }

async function refresh() {
  S = await api('/api/state');
  if (!JOB && S.jobs.length) JOB = S.jobs[0].name;
  $('#jobSel').innerHTML = S.jobs.map(j => `<option ${j.name === JOB ? 'selected' : ''}>${esc(j.name)}</option>`).join('') || '<option>작업 없음</option>';
  $('#busy').textContent = S.busy ? '● 작업 중: ' + (S.cmd || []).slice(0, 1).join(' ') : '';
  document.querySelectorAll('[data-run]').forEach(b => b.disabled = S.busy);
  renderUnits(); renderSettings();
}
function pill(t, cls = '') { return `<span class="pill ${cls}">${t}</span>` }
function renderUnits() {
  const j = job();
  $('#units').innerHTML = !j ? '' : j.units.map(u => `
    <div class="unit ${u.prefix === SID ? 'sel' : ''}" onclick="pick('${u.prefix}')">
      <b>${esc(u.prefix)} · ${esc(u.section)}</b>
      <div class="pills">
        ${pill('개작', u.rewrite ? (u.rewrite_passed === false ? 'warn' : 'ok') : '')}
        ${pill(u.score != null ? '대본 ' + u.score + '점' : '대본', u.script ? (u.score >= 80 ? 'ok' : 'warn') : '')}
        ${pill(u.audio_min ? '음성 ' + u.audio_min + '분' : '음성', u.audio_min ? 'ok' : '')}
        ${pill('그림 ' + u.images + '/' + u.scenes, u.scenes && u.images >= u.scenes ? 'ok' : (u.images ? 'warn' : ''))}
        ${pill('영상', u.video ? 'ok' : '')}
      </div>
    </div>`).join('');
}
function renderSettings() {
  const j = job(); if (!j) return;
  $('#setJob').textContent = '· ' + j.name;
  $('#sStyle').innerHTML = S.styles.map(s => `<option value="${s.id}" ${s.id === j.settings.style ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
  $('#sVoice').innerHTML = S.voices.map(v => `<option ${v === j.settings.voice ? 'selected' : ''}>${v}</option>`).join('');
  if (document.activeElement?.closest?.('#setCard')) return;
  $('#sMin').value = j.settings.target_minutes; $('#sSpeed').value = j.settings.speed; $('#sThumb').value = j.settings.thumb_scene;
}
async function saveSettings() {
  await api(`/api/job/${encodeURIComponent(JOB)}/settings`, {method: 'PUT', body: JSON.stringify({
    style: $('#sStyle').value, target_minutes: +$('#sMin').value, voice: $('#sVoice').value,
    speed: +$('#sSpeed').value, thumb_scene: +$('#sThumb').value})});
  await refresh();
}
$('#jobSel').onchange = e => { JOB = e.target.value; SID = null; U = null; refresh(); renderMain() };

// ── 업로드 ──
const drop = $('#drop');
drop.onclick = () => $('#file').click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('on') };
drop.ondragleave = () => drop.classList.remove('on');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('on'); upload([...e.dataTransfer.files]) };
$('#file').onchange = e => upload([...e.target.files]);
const readURL = f => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f) });
async function upload(files) {
  const name = $('#jobName').value.trim(); if (!name) return alert('작업 이름을 정해 주세요');
  let last;
  for (const f of files) last = await api('/api/upload', {method: 'POST', body: JSON.stringify({job: name, title: $('#jobTitle').value, filename: f.name, data: await readURL(f)})});
  JOB = name; await refresh();
  const u = job()?.units.find(x => x.name === last?.unit); if (u) pick(u.prefix);
}

// ── 실행 ──
async function runCmd(cmd, extra = []) {
  if (DIRTY && !confirm('저장하지 않은 대본 수정이 있어요. 그래도 실행할까요?')) return;
  await api('/api/run', {method: 'POST', body: JSON.stringify({args: [cmd, '--job', JOB, '--only', SID, ...extra]})});
  refresh();
}
async function runAll(cmd) {
  const n = job()?.units.length || 0;
  if (!n) return alert('원고를 먼저 넣어 주세요');
  if (!confirm(`「${JOB}」의 단원 ${n}개를 모두 ${cmd === 'all' ? '끝까지 만들까요? (단원마다 Claude 10분 + 그림 수십 장)' : '개작·대본까지 만들까요?'}`)) return;
  await api('/api/run', {method: 'POST', body: JSON.stringify({args: cmd === 'all' ? ['all', '--job', JOB] : ['prep', '--job', JOB]})});
  refresh();
}
async function stopRun() { await api('/api/stop', {method: 'POST'}); refresh() }

// ── 본문 ──
async function pick(sid) { SID = sid; DIRTY = false; renderUnits(); await loadUnit(); }
async function loadUnit() {
  if (!SID) return;
  U = await api(`/api/unit/${encodeURIComponent(JOB)}/${SID}`);
  renderMain();
}
function step(cmd, label, title) { return `<button data-run onclick="runCmd('${cmd}')" title="${title}" ${S.busy ? 'disabled' : ''}>${label}</button>` }
function renderMain() {
  if (!U || !SID) { $('#main').innerHTML = '<div class="empty">왼쪽에서 원고(docx)를 넣고 단원을 고르세요.</div>'; return }
  const st = U.status;
  $('#main').innerHTML = `
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">${esc(st.prefix)} · ${esc(st.section)}</h2>
      <button onclick="openFolder()">폴더 열기</button>
    </div>
    <div class="steps" style="margin-top:10px">
      ${step('s0-rewrite', '1 안전 개작', '원문을 저작권 안전한 새 글로 (Claude)')}<span class="arrow">→</span>
      ${step('s1-script', '2 대본·채점', '롱폼 대본 + 100점 채점 (Claude)')}<span class="arrow">→</span>
      ${step('s2-tts', '3 목소리', 'SuperTonic3')}<span class="arrow">→</span>
      ${step('s3-images', '4 그림', 'Codex 3개 동시')}<span class="arrow">→</span>
      ${step('s4-render', '5 영상', 'ffmpeg 1920×1080')}<span class="arrow">→</span>
      ${step('s5-thumb', '6 썸네일', '1280×720')}
      <span style="flex:1"></span>
      <button class="go" data-run onclick="runCmd('make')" ${S.busy ? 'disabled' : ''} title="대본 확인 뒤: 목소리→그림→영상→썸네일">▶ 3→6 딸깍</button>
      <button class="pri" data-run onclick="runCmd('all')" ${S.busy ? 'disabled' : ''} title="개작부터 썸네일까지 한 번에">▶ 전체 1→6</button>
      <button onclick="stopRun()">■ 멈춤</button>
    </div>
    <div class="tabs">
      ${[['src', '원고·개작'], ['script', '대본'], ['img', '그림'], ['vid', '영상'], ['up', '유튜브 올리기']].map(([k, t]) => `<button class="${TAB === k ? 'on' : ''}" onclick="TAB='${k}';renderMain()">${t}</button>`).join('')}
    </div>
    <div id="tab"></div>`;
  ({src: tabSrc, script: tabScript, img: tabImg, vid: tabVid, up: tabUp})[TAB]();
}

function tabSrc() {
  const rw = U.rewrite, ck = U.check;
  const rwTxt = rw ? (rw.unit_title ? rw.unit_title + '\n\n' : '') + rw.sections.map(s => s.label + ' ' + (s.title || '') + '\n' + s.paragraphs.join('\n')).join('\n\n') : '아직 없어요 — 「1 안전 개작」을 눌러 주세요.';
  $('#tab').innerHTML = `
    ${ck ? `<div class="row" style="margin-bottom:10px">
      ${pill(ck.passed ? '검증 통과' : '검증 문제 남음', ck.passed ? 'ok' : 'warn')}
      ${pill('원문과 최대 ' + ck.max_run + '자 겹침 (기준 ' + ck.limits.max_run + '자 이하)')}
      ${pill('문단 유사도 최대 ' + ck.example_sim_max + ' (기준 ' + ck.limits.sim + ' 이하)')}
      ${pill('원문 ' + ck.chars_orig + '자 → 개작 ' + ck.chars_new + '자')}
    </div>
    ${ck.problems?.length ? `<div class="muted" style="color:var(--warn)">${ck.problems.map(esc).join('<br>')}</div>` : ''}
    ${ck.swaps?.length ? `<p class="muted">바꾼 장면·예시: ${ck.swaps.map(s => esc(s.from) + ' → ' + esc(s.to)).join(' · ')}</p>` : ''}` : ''}
    <div class="cols">
      <div><h3>원문 (01_raw · 보관만)</h3><div class="txt">${esc(U.raw_text)}</div></div>
      <div><h3>안전 개작본 (02_rewrite · 영상의 재료)</h3><div class="txt">${esc(rwTxt)}</div></div>
    </div>
    <p class="muted">${ck ? esc(ck.note) : ''} 개작본 docx 를 직접 고쳐도 돼요 — 고친 docx 가 이깁니다.</p>`;
}

function tabScript() {
  const s = U.script;
  if (!s) { $('#tab').innerHTML = '<div class="empty">아직 대본이 없어요 — 「2 대본·채점」을 눌러 주세요.</div>'; return }
  const sc = U.score;
  const imgOf = n => U.images.find(i => i.n === n);
  let n = 0;
  $('#tab').innerHTML = `
    ${sc ? `<div class="cols" style="margin-bottom:8px">
      <div><span class="score">${sc.score}</span><span class="muted"> / 100 ${sc.first_score !== sc.score ? '(초안 ' + sc.first_score + '점 → 고쳐 씀)' : ''}</span>
        <div class="muted">${sc.stats ? `${sc.stats.chapters}장 · 씬 ${sc.stats.scenes} · 문장 ${sc.stats.lines} · ${sc.stats.say_chars}자 · 약 ${sc.stats.est_minutes}분` : ''}</div>
        ${sc.overlaps?.length ? `<div style="color:var(--bad)">원문 겹침: ${sc.overlaps.map(esc).join('<br>')}</div>` : pill('원문 15자 겹침 없음', 'ok')}
      </div>
      <div><table>${(sc.items || []).map(i => `<tr><td>${esc(i.name)}</td><td>${i.score}/${i.max}</td><td class="muted">${esc(i.comment)}</td></tr>`).join('')}</table></div>
    </div>
    ${sc.fixes?.length ? `<details><summary class="muted">채점관의 고칠 점 ${sc.fixes.length}개</summary><ul>${sc.fixes.map(f => '<li>' + esc(f) + '</li>').join('')}</ul></details>` : ''}` : ''}
    <div class="row" style="margin:10px 0">
      <b>${esc(s.title)}</b><span class="muted">${esc(s.topic)}</span><span style="flex:1"></span>
      ${U.edited ? pill('사람이 고친 대본 사용 중', 'warn') + '<button onclick="resetScript()">수정 되돌리기</button>' : ''}
      <button class="pri" onclick="saveScript()">대본 저장</button>
    </div>
    <h3>등장인물 — 생김새 고정 문장(영어, 매 컷 프롬프트 맨 앞)</h3>
    ${(s.characters || []).map((c, i) => `<div class="line" style="grid-template-columns:60px 140px 1fr"><input value="${esc(c.id)}" data-c="${i}" data-k="id"><input value="${esc(c.name)}" data-c="${i}" data-k="name"><input value="${esc(c.look)}" data-c="${i}" data-k="look"></div>`).join('') || '<p class="muted">없음</p>'}
    <h3>썸네일 · 유튜브</h3>
    <div class="line" style="grid-template-columns:1fr 1fr 1fr"><input id="th1" value="${esc(s.thumbnail?.line1)}"><input id="th2" value="${esc(s.thumbnail?.line2)}"><input id="thk" value="${esc(s.thumbnail?.keyword)}" title="강조색 단어"></div>
    <input id="ytt" value="${esc(s.youtube?.title)}"><textarea id="ytd" rows="3" style="margin-top:4px">${esc(s.youtube?.description)}</textarea>
    ${s.chapters.map((ch, ci) => `
      <div class="chap"><input value="${esc(ch.title)}" data-ch="${ci}" style="font-weight:700;max-width:420px"></div>
      ${ch.scenes.map((scn, si) => { n++; const im = imgOf(n); return `
        <div class="scene">
          <div>${im?.url ? `<img src="${im.url}">` : `<div class="ph">그림 ${String(n).padStart(3, '0')}</div>`}
            <div class="muted">씬 ${n} · 인물 <input value="${esc((scn.image.chars || []).join(','))}" data-ci="${ci}" data-si="${si}" data-k="chars" style="width:90px;padding:2px 4px"></div></div>
          <div>
            <textarea rows="2" data-ci="${ci}" data-si="${si}" data-k="prompt" title="그림 프롬프트(영어)">${esc(scn.image.prompt)}</textarea>
            <div class="line muted" style="margin-top:6px"><span>읽기(say) — 숫자는 한글로</span><span>자막(cap) — 숫자는 아라비아</span><span></span></div>
            ${scn.lines.map((ln, li) => `<div class="line"><textarea rows="1" data-ci="${ci}" data-si="${si}" data-li="${li}" data-k="say">${esc(ln.say)}</textarea><textarea rows="1" data-ci="${ci}" data-si="${si}" data-li="${li}" data-k="cap">${esc(ln.cap)}</textarea><button title="문장 삭제" onclick="delLine(${ci},${si},${li})">×</button></div>`).join('')}
            <button onclick="addLine(${ci},${si})">+ 문장</button>
          </div>
        </div>`}).join('')}`).join('')}`;
  $('#tab').oninput = () => { DIRTY = true };
}
function collect() {
  const s = JSON.parse(JSON.stringify(U.script));
  document.querySelectorAll('#tab [data-c]').forEach(e => s.characters[+e.dataset.c][e.dataset.k] = e.value);
  document.querySelectorAll('#tab [data-ch]').forEach(e => s.chapters[+e.dataset.ch].title = e.value);
  document.querySelectorAll('#tab [data-si]').forEach(e => {
    const scn = s.chapters[+e.dataset.ci].scenes[+e.dataset.si], k = e.dataset.k;
    if (k === 'prompt') scn.image.prompt = e.value;
    else if (k === 'chars') scn.image.chars = e.value.split(',').map(x => x.trim()).filter(Boolean);
    else scn.lines[+e.dataset.li][k] = e.value;
  });
  s.thumbnail = {line1: $('#th1').value, line2: $('#th2').value, keyword: $('#thk').value};
  s.youtube = {title: $('#ytt').value, description: $('#ytd').value};
  return s;
}
async function saveScript() { await api(`/api/unit/${encodeURIComponent(JOB)}/${SID}/script`, {method: 'PUT', body: JSON.stringify(collect())}); DIRTY = false; await loadUnit(); }
async function resetScript() { if (!confirm('사람이 고친 내용을 지우고 Claude 원안으로 돌아갈까요?')) return; await api(`/api/unit/${encodeURIComponent(JOB)}/${SID}/script`, {method: 'DELETE'}); DIRTY = false; await loadUnit(); }
function addLine(ci, si) { U.script = collect(); U.script.chapters[ci].scenes[si].lines.push({say: '', cap: ''}); DIRTY = true; tabScript() }
function delLine(ci, si, li) { U.script = collect(); const L = U.script.chapters[ci].scenes[si].lines; if (L.length > 1) L.splice(li, 1); DIRTY = true; tabScript() }

function tabImg() {
  if (!U.images.length) { $('#tab').innerHTML = '<div class="empty">대본이 있어야 그림 목록이 생겨요.</div>'; return }
  const have = U.images.filter(i => i.url).length;
  $('#tab').innerHTML = `
    <p class="muted">그림 ${have}/${U.images.length}장 · 화풍과 인물 규칙은 images/HANDOFF.md(인계 메모)에 있어요. 「4 그림」은 없는 그림과 프롬프트가 바뀐 그림만 그려요. 직접 바꿔 넣은 그림은 그대로 둬요.</p>
    <div class="grid">${U.images.map(i => `
      <div class="gi">${i.url ? `<img src="${i.url}" loading="lazy">` : `<div class="ph">없음</div>`}
        <div class="meta"><b>${String(i.n).padStart(3, '0')}</b> · ${i.chapter}장 ${i.manual ? pill('직접 넣음', 'warn') : ''}<div title="${esc(i.prompt)}">${esc(i.first)}</div></div>
        <div class="btns"><button data-run onclick="runCmd('s3-images',['--scenes','${i.n}'])" ${S.busy ? 'disabled' : ''}>다시 그리기</button>
          <button onclick="replaceImg(${i.n})">바꿔 넣기</button></div>
      </div>`).join('')}</div>`;
}
function replaceImg(n) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/png,image/jpeg';
  inp.onchange = async () => { await api(`/api/unit/${encodeURIComponent(JOB)}/${SID}/image/${n}`, {method: 'POST', body: JSON.stringify({data: await readURL(inp.files[0])})}); loadUnit() };
  inp.click();
}

function tabVid() {
  $('#tab').innerHTML = U.video ? `
    <video src="${U.video}" controls preload="metadata"></video>
    <div class="cols" style="margin-top:12px">
      <div><h3>썸네일</h3>${U.thumb ? `<img src="${U.thumb}" style="width:100%;border-radius:8px">` : '<p class="muted">「6 썸네일」을 눌러 주세요.</p>'}</div>
      <div><h3>유튜브 문구</h3><div class="txt">${esc(U.youtube)}</div></div>
    </div>
    <h3>검수 시트 (5초 간격)</h3>
    ${U.contacts.map(c => `<a href="${c}" target="_blank"><img src="${c}" style="width:100%;border-radius:8px;margin-bottom:8px"></a>`).join('')}`
    : '<div class="empty">아직 영상이 없어요 — 「5 영상」을 눌러 주세요.</div>';
}
let ACCS = null;
async function tabUp() {
  const up = U.upload || {}, m = up.meta, st = up.state || {};
  if (!ACCS) ACCS = await api('/api/accounts');
  const accOpts = ACCS.accounts.map(a => `<option value="${esc(a.name)}" ${a.name === ACCS.current ? 'selected' : ''}>${esc(a.label || a.name)}</option>`).join('');
  const posted = st.posted;
  const copy = (id, label) => `<button onclick="navigator.clipboard.writeText(document.getElementById('${id}').value)">${label} 복사</button>`;
  $('#tab').innerHTML = `
    ${posted ? `<p>${pill(st.scheduled ? '예약 공개 ' + esc(st.scheduled.when) : '올림', 'ok')} <a href="${esc(posted.url || '#')}" target="_blank">${esc(posted.url || '')}</a> <span class="muted">${esc(posted.at || '')}</span></p>` : ''}
    ${st.error ? `<p style="color:var(--bad)">지난 시도 실패: ${esc(st.error)}</p>` : ''}
    <div class="row" style="margin-bottom:10px">
      <label style="margin:0">채널</label><select id="upAcc" style="width:auto" onchange="api('/api/accounts/use',{method:'POST',body:JSON.stringify({name:this.value})}).then(()=>ACCS=null)">${accOpts || '<option>계정 없음</option>'}</select>
      <label style="margin:0">공개</label><select id="upVis" style="width:auto"><option value="public">공개</option><option value="unlisted">일부 공개</option><option value="private">비공개</option></select>
      <label style="margin:0">예약</label><input id="upAt" type="datetime-local" style="width:auto">
    </div>
    <div class="row">
      <button data-run onclick="runPlain(['login','--account',$('#upAcc').value])">① 로그인 창 열기</button>
      <button data-run onclick="runCmd('yt-meta',['--force'])">문구 다시 쓰기 (Claude)</button>
      <button data-run onclick="post(true)">미리 채워 보기</button>
      <button class="pri" data-run onclick="post(false)" ${U.video ? '' : 'disabled'}>▶ 유튜브에 올리기</button>
    </div>
    <p class="muted">왼쪽에 뜨는 Chrome(로그인된 전용 프로필)에서 YouTube Studio 가 자동으로 채워져요: 영상 → 제목·설명 → 썸네일 → 태그 → AI 사용 표시 → 아동용 아님 → 공개/예약 → 고정 댓글(공개일 때). 「미리 채워 보기」는 게시 버튼만 누르지 않아요.</p>
    ${!m ? '<div class="empty">대본이 있어야 문구가 생겨요.</div>' : `
    ${!up.ready ? '<p style="color:var(--warn)">아직 유튜브 문구를 쓰지 않았어요 — 「문구 다시 쓰기」를 눌러 주세요(지금은 대본의 기본 제목·설명).</p>' : ''}
    ${up.check ? pill(up.check.passed ? '원고 겹침 검사 통과' : '원고 겹침 ' + up.check.problems.length + '건', up.check.passed ? 'ok' : 'warn') : ''}
    <h3>제목 ${copy('ytT', '')}</h3><textarea id="ytT" rows="1" readonly>${esc(m.title)}</textarea>
    <h3>설명 ${copy('ytD', '')}</h3><textarea id="ytD" rows="16" readonly>${esc(m.description)}</textarea>
    <h3>태그 ${copy('ytG', '')}</h3><textarea id="ytG" rows="2" readonly>${esc(m.tags.join(', '))}</textarea>
    <h3>고정 댓글 ${copy('ytC', '')}</h3><textarea id="ytC" rows="1" readonly>${esc(m.pinned_comment)}</textarea>
    ${U.thumb ? `<h3>썸네일</h3><img src="${U.thumb}" style="width:360px;border-radius:8px">` : ''}`}`;
}
async function runPlain(args) { await api('/api/run', {method: 'POST', body: JSON.stringify({args})}); refresh() }
async function post(dry) {
  const at = $('#upAt').value, vis = $('#upVis').value, acc = $('#upAcc').value;
  const what = dry ? '업로드 창을 채워만 볼까요? (게시는 안 눌러요)' : at ? `${at.replace('T', ' ')} 에 예약 공개로 올릴까요?` : `지금 「${vis === 'public' ? '공개' : vis === 'unlisted' ? '일부 공개' : '비공개'}」로 올릴까요?`;
  if (!confirm(`${acc} 채널 — ${what}`)) return;
  const args = ['--account', acc, '--visibility', vis];
  if (at) args.push('--at', at.replace('T', ' '));
  if (dry) args.push('--dry-run');
  await runCmd('post', args);
}
async function openFolder() { await api('/api/open', {method: 'POST', body: JSON.stringify({path: U.folder})}) }

// ── 로그 ──
let wasBusy = false;
async function pollLog() {
  try {
    const r = await api('/api/log?since=' + since);
    since = r.next;
    if (r.lines.length) {
      const el = $('#log'), atEnd = el.scrollTop + el.clientHeight >= el.scrollHeight - 20;
      el.insertAdjacentHTML('beforeend', r.lines.map(l => `<div>${esc(l)}</div>`).join(''));
      if (atEnd) el.scrollTop = el.scrollHeight;
    }
    if (r.busy !== wasBusy || (r.busy && r.lines.length)) {
      await refresh();
      if (!r.busy && wasBusy && SID && !DIRTY) await loadUnit();
      wasBusy = r.busy;
    }
  } catch (e) {}
  setTimeout(pollLog, 1000);
}
refresh().then(pollLog);
</script>
</body>
</html>
